<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #182848, #4b6cb7);
    }
    .home {
      width: min(100%, 560px);
      padding: 56px 28px;
      text-align: center;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.2);
    }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 7vw, 3.2rem); }
    p { margin: 0 0 28px; color: #e5eaf6; line-height: 1.6; }
    .instagram {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 999px;
      color: white;
      background: #e1306c;
      text-decoration: none;
      font-weight: bold;
      transition: transform .2s, background .2s;
    }
    .instagram:hover { transform: translateY(-3px); background: #c92860; }
  </style>
</head>
<body>
  <main class="home">
    <h1>Welcome to My Website!</h1>
    <p>Hello! Thanks for visiting my personal home page.</p>
    <!-- Replace YOUR_USERNAME with your Instagram username. -->
    <a class="instagram"
       href="https://www.instagram.com/YOUR_USERNAME/"
       target="_blank"
       rel="noopener noreferrer">Visit My Instagram</a>
  </main>
</body>
</html>
