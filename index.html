<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      padding: 70px 20px;
    }
    h1 {
      font-size: 38px;
      color: #60a5fa;
    }
    p {
      color: #cbd5e1;
      font-size: 17px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
    footer {
      margin-top: 80px;
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>This is my personal website.</p>
    <a class="btn"
       href="https://www.instagram.com/YOUR_USERNAME/"
       target="_blank">
       Visit My Instagram
    </a>
  </header>

  <footer>
    © 2026 My Personal Website
  </footer>
<!-- Supabase visitor tracking -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<div id="tracking-status"
     style="padding:15px;margin:15px;
     background:#eeeeee;color:#222;
     border-radius:8px;">
  Checking visitor tracking...
</div>

<script>
(async function () {
  const status = document.getElementById("tracking-status");

  try {
    const SUPABASE_URL = "https://jsiytdnmrjdkenobahgk.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_z5fvqxfYXb5CVVmKCls5aA_1lMZpzxC";

    if (!window.supabase) {
      throw new Error("Supabase library did not load.");
    }

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    let sessionId =
      sessionStorage.getItem("visitor_session_id");

    if (!sessionId) {
      sessionId = crypto.randomUUID();
      sessionStorage.setItem("visitor_session_id", sessionId);
    }

    const { error } = await client
      .from("visits")
      .insert({
        session_id: sessionId,
        page_path: location.pathname
      });

    if (error) {
      throw error;
    }

    status.textContent =
      "SUCCESS: Visitor recorded in Supabase!";

  } catch (error) {
    console.error("Tracking error:", error);

    status.textContent =
      "TRACKING ERROR: " +
      (error.message || "Unknown error") +
      (error.code ? " | Code: " + error.code : "");
  }
})();
</script>
</body>
</html>
